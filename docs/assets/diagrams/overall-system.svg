<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">FpvDeck overall system architecture</title><desc id="desc">Independent T8L control plane alongside the analog video, compute, display, power, controller, battery measurement and storage systems.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#6fb4ff"/></marker><style>.b{fill:#111d2b;stroke:#304158;stroke-width:2}.t{fill:#f4f8ff;font:600 16px DejaVu Sans}.s{fill:#91a2b8;font:13px DejaVu Sans}.l{stroke:#6fb4ff;stroke-width:3;fill:none;marker-end:url(#a)}.g{stroke:#67e8a5}</style></defs>
  <rect width="1200" height="500" rx="24" fill="#080d14"/>
  <text x="42" y="48" class="t" font-size="23">CONTROL PLANE · INDEPENDENT OF LINUX</text>
  <g><rect class="b" x="42" y="75" width="210" height="72" rx="14"/><text class="t" x="68" y="108">T8L controls</text><text class="s" x="68" y="130">gimbals + switches</text></g>
  <g><rect class="b" x="340" y="75" width="205" height="72" rx="14"/><text class="t" x="365" y="108">T8L + ELRS</text><text class="s" x="365" y="130">2.4 GHz control RF</text></g>
  <g><rect class="b" x="635" y="75" width="205" height="72" rx="14"/><text class="t" x="662" y="108">Aircraft</text><text class="s" x="662" y="130">ELRS RX · FC · camera · VTX</text></g>
  <path class="l g" d="M252 111h88"/><path class="l g" d="M545 111h90"/>
  <text x="42" y="208" class="t" font-size="23">VIDEO + COMPUTE PLANE</text>
  <g><rect class="b" x="42" y="235" width="155" height="78" rx="14"/><text class="t" x="68" y="268">5.8 GHz VRX</text><text class="s" x="68" y="290">RF → CVBS · added</text></g>
  <g><rect class="b" x="245" y="235" width="155" height="78" rx="14"/><text class="t" x="269" y="268">CVBS decoder</text><text class="s" x="269" y="290">analog → CSI-2</text></g>
  <g><rect class="b" x="448" y="235" width="155" height="78" rx="14"/><text class="t" x="475" y="268">Linux SoM</text><text class="s" x="475" y="290">video + apps</text></g>
  <g><rect class="b" x="651" y="235" width="155" height="78" rx="14"/><text class="t" x="681" y="268">HD touchscreen</text><text class="s" x="681" y="290">display + touch UI</text></g>
  <path class="l" d="M197 274h48"/><path class="l" d="M400 274h48"/><path class="l" d="M603 274h48"/><path class="l" d="M738 147v38H120v50"/>
  <text class="s" x="445" y="180">independent 5.8 GHz analog video return</text>
  <g><rect class="b" x="865" y="235" width="285" height="78" rx="14"/><text class="t" x="891" y="268">Removable storage</text><text class="s" x="891" y="290">DVR + media · filesystem TBD</text></g>
  <path class="l" d="M603 296h262"/>
  <g><rect class="b" x="42" y="376" width="225" height="78" rx="14"/><text class="t" x="68" y="409">Internal 2×18650</text><text class="s" x="68" y="431">topology to verify</text></g>
  <g><rect class="b" x="350" y="376" width="225" height="78" rx="14"/><text class="t" x="376" y="409">Controller MCU</text><text class="s" x="376" y="431">power · inputs · watchdog</text></g>
  <g><rect class="b" x="658" y="376" width="225" height="78" rx="14"/><text class="t" x="684" y="409">Protected ADC</text><text class="s" x="684" y="431">external LiPo measurement</text></g>
  <path class="l g" d="M267 415h83"/><path class="l g" d="M575 415h83"/><path class="l g" d="M462 376v-63"/><path class="l g" d="M154 376V313"/>
  <text x="916" y="398" class="s">External LiPo is never</text><text x="916" y="420" class="s">a device power source.</text>
</svg>

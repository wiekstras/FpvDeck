<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FpvDeck video pipeline</title><desc id="desc">Analog FPV video with embedded Betaflight OSD is decoded, composited with an independent RGB layer, displayed, and optionally recorded.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#6fb4ff"/></marker><style>.b{fill:#111d2b;stroke:#304158;stroke-width:2}.t{fill:#f4f8ff;font:600 15px DejaVu Sans}.s{fill:#91a2b8;font:12px DejaVu Sans}.l{stroke:#6fb4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke-dasharray:8 6}</style></defs>
  <rect width="1200" height="360" rx="24" fill="#080d14"/>
  <text x="40" y="46" class="t" font-size="23">FIELD-RATE LIVE PATH · NO DVR BACKPRESSURE</text>
  <g transform="translate(30 82)"><rect class="b" width="120" height="82" rx="13"/><text class="t" x="14" y="35">FPV camera</text><text class="s" x="14" y="58">analog pixels</text></g>
  <g transform="translate(165 82)"><rect class="b" width="135" height="82" rx="13"/><text class="t" x="14" y="35">FC analog OSD</text><text class="s" x="14" y="58">Betaflight pixels</text></g>
  <g transform="translate(315 82)"><rect class="b" width="100" height="82" rx="13"/><text class="t" x="20" y="35">5.8 VTX</text><text class="s" x="12" y="58">aircraft RF</text></g>
  <g transform="translate(430 82)"><rect class="b" width="120" height="82" rx="13"/><text class="t" x="16" y="35">5.8 VRX</text><text class="s" x="13" y="58">RF → CVBS</text></g>
  <g transform="translate(565 82)"><rect class="b" width="130" height="82" rx="13"/><text class="t" x="12" y="35">CVBS decoder</text><text class="s" x="14" y="58">analog → CSI-2</text></g>
  <g transform="translate(710 82)"><rect class="b" width="125" height="82" rx="13"/><text class="t" x="14" y="35">VideoService</text><text class="s" x="14" y="58">bounded buffers</text></g>
  <g transform="translate(850 82)"><rect class="b" width="130" height="82" rx="13"/><text class="t" x="16" y="35">Compositor</text><text class="s" x="16" y="58">video + RGB</text></g>
  <g transform="translate(995 82)"><rect class="b" width="170" height="82" rx="13"/><text class="t" x="22" y="35">HD touchscreen</text><text class="s" x="22" y="58">DSI + touch UI</text></g>
  <path class="l" d="M150 123h15M300 123h15M415 123h15M550 123h15M695 123h15M835 123h15M980 123h15"/>
  <g transform="translate(710 235)"><rect class="b" width="125" height="70" rx="13"/><text class="t" x="12" y="31">Pre-overlay DVR</text><text class="s" x="15" y="52">bounded tee</text></g>
  <g transform="translate(850 235)"><rect class="b" width="130" height="70" rx="13"/><text class="t" x="14" y="31">RGB overlays</text><text class="s" x="14" y="52">apps + widgets</text></g>
  <g transform="translate(995 235)"><rect class="b" width="170" height="70" rx="13"/><text class="t" x="31" y="31">Overlay DVR</text><text class="s" x="53" y="52">optional</text></g>
  <path class="l d" d="M772 164v71M915 235v-71M980 270h15"/>
  <text x="40" y="331" class="s">The incoming Betaflight OSD remains part of the decoded video. FpvDeck never inserts a monochrome analog OSD.</text>
</svg>

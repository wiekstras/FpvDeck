name: Firmware or UI bug
description: Report reproducible behavior in FpvDeck firmware.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and logs
      description: Include board revision, firmware commit and PAL/NTSC source.
    validations:
      required: true

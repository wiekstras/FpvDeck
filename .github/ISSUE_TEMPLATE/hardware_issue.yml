name: Hardware finding
description: Record measurements, bring-up failures or a design-review issue.
title: "hardware: "
labels: [hardware]
body:
  - type: textarea
    id: setup
    attributes:
      label: Hardware and instruments
      description: Include board/module revisions, supply limit and instrument model.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Measurement and evidence
      description: Include exact probe points and attach scope captures/photos.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
    validations:
      required: true

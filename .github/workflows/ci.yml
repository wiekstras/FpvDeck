name: CI

on:
  push:
  pull_request:

jobs:
  host-and-hardware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: ./scripts/test-host
      - name: Generate and validate HAT
        run: python3 hardware/gen_hat.py --check
      - name: Ensure generated artifacts are committed
        run: git diff --exit-code

  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: ESP32-P4 build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32p4
          idf.py build

name: CI

on:
  push:
  pull_request:

jobs:
  desktop-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ffmpeg \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-tools-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtmultimedia qml6-module-qttest qml6-module-qtqml \
            qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates
      - name: Cache CMake build
        uses: actions/cache@v5
        with:
          path: build/check
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'software/**', 'firmware/**') }}
      - name: Build and test
        run: ./scripts/check
      - name: Verify required engineering documents
        run: ./scripts/check-docs
